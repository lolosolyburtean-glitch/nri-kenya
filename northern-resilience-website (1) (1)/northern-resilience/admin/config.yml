# Decap CMS Configuration for Northern Resilience Initiatives
# This allows the site owner to edit content through a login dashboard

backend:
  name: git-gateway
  branch: main

# Media / photo uploads will go into the assets folder
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Site logo appears in the editor
logo_url: /assets/logo.png

# Collections = the different sections the owner can edit
collections:
  # Homepage content
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "index"
        label: "Homepage Content"
        file: "index.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Hero Headline", name: "hero_headline", widget: "string" }
          - { label: "Hero Sub-text", name: "hero_text", widget: "text" }
          - { label: "Note", name: "note", widget: "text", default: "To edit the full page design, open the HTML file or contact the developer." }

  # About page
  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Content"
        file: "about.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Main Headline", name: "headline", widget: "string" }
          - { label: "Note", name: "note", widget: "text", default: "For full text changes, edit about.html or ask the developer." }

  # Media library (photos & documents)
  - name: "media"
    label: "Photos & Documents"
    folder: "assets/uploads"
    extension: "jpg"
    format: "yaml"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image or File", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }

# Simple settings
local_backend: true   # allows testing locally if needed
